<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
    <title>API DE EL VIGILANTE · Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0f;
            color: #e0d7f0;
            overflow-x: hidden;
        }
        
        :root {
            --bg: #0a0a0f;
            --card: rgba(20, 15, 35, 0.9);
            --border: #2d1f4a;
            --accent: #9b4dff;
            --text: #e0d7f0;
            --muted: #988ab3;
        }
        
        #loadingScreen {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: var(--bg);
            z-index: 99999;
            display: flex; justify-content: center; align-items: center; flex-direction: column;
        }
        
        .spinner {
            width: 50px; height: 50px;
            border: 3px solid rgba(155,77,255,0.2);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        
        #authScreen {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle at 30% 30%, rgba(155,77,255,0.08), transparent 50%),
                        radial-gradient(circle at 70% 70%, rgba(100,50,180,0.06), transparent 50%), var(--bg);
            z-index: 10001;
            display: flex; justify-content: center; align-items: center;
        }
        
        .auth-card {
            background: var(--card);
            backdrop-filter: blur(25px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px; width: 420px; max-width: 90%;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
        }
        
        .auth-logo {
            width: 80px; height: 80px; border-radius: 50%;
            border: 2px solid var(--accent);
            box-shadow: 0 0 30px rgba(155,77,255,0.4);
            margin-bottom: 20px;
        }
        
        .auth-title { font-size: 22px; font-weight: 800; color: var(--text); margin-bottom: 4px; }
        .auth-subtitle { font-size: 13px; color: var(--muted); margin-bottom: 20px; }
        
        .auth-form input {
            width: 100%; margin-bottom: 14px;
            background: rgba(0,0,0,0.3); border: 1px solid var(--border);
            color: var(--text); padding: 12px 16px; border-radius: 12px; font-size: 14px; outline: none;
        }
        
        .auth-form input:focus { border-color: var(--accent); }
        
        .btn-primary {
            background: linear-gradient(135deg, #9b4dff, #6a1b9a);
            color: white; border: none; padding: 12px 28px; border-radius: 30px;
            font-weight: 700; font-size: 14px; cursor: pointer; width: 100%; transition: 0.2s;
        }
        
        .btn-primary:hover { background: linear-gradient(135deg, #b87aff, #8a2be2); }
        .auth-link { color: var(--accent); cursor: pointer; font-size: 13px; display: inline-block; margin-top: 12px; }
        .auth-link:hover { color: #c9b0ff; }
        .auth-divider { color: #6b5b85; margin: 14px 0; font-size: 12px; }
        
        .top-bar {
            position: fixed; top: 0; left: 0; right: 0; height: 64px;
            background: rgba(20,15,35,0.95); backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 24px; z-index: 1000;
        }
        
        .top-bar-left { display: flex; align-items: center; gap: 16px; }
        
        .menu-toggle {
            width: 36px; height: 36px; background: none; border: none;
            cursor: pointer; display: flex; flex-direction: column;
            justify-content: center; align-items: center; gap: 4px; border-radius: 8px;
        }
        
        .menu-toggle:hover { background: rgba(155,77,255,0.1); }
        
        .menu-toggle span {
            display: block; width: 20px; height: 2px;
            background: var(--text); transition: 0.3s; border-radius: 2px;
        }
        
        .api-name {
            font-size: 20px; font-weight: 800;
            background: linear-gradient(135deg, #c9b0ff, #9b4dff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        
        .pro-badge {
            background: linear-gradient(135deg, #9b4dff, #6a1b9a);
            color: white; font-weight: 700; font-size: 10px;
            padding: 4px 10px; border-radius: 20px; margin-left: 10px;
        }
        
        .user-section { display: flex; align-items: center; gap: 10px; }
        
        .btn-logout {
            background: rgba(155,77,255,0.1); border: 1px solid var(--border);
            color: var(--muted); padding: 6px 14px; border-radius: 20px;
            cursor: pointer; font-size: 12px; transition: 0.2s;
        }
        
        .btn-logout:hover { background: rgba(155,77,255,0.2); color: var(--text); }
        
        .sidebar {
            position: fixed; top: 64px; left: -280px; width: 280px;
            height: calc(100vh - 64px); background: rgba(20,15,35,0.98);
            backdrop-filter: blur(20px); border-right: 1px solid var(--border);
            overflow-y: auto; transition: left 0.3s; z-index: 999;
        }
        
        .sidebar.active { left: 0; }
        
        .sidebar-overlay {
            position: fixed; top: 64px; left: 0;
            width: 100%; height: calc(100vh - 64px);
            background: rgba(0,0,0,0.6); opacity: 0; visibility: hidden;
            transition: 0.3s; z-index: 998;
        }
        
        .sidebar-overlay.active { opacity: 1; visibility: visible; }
        
        .sidebar-nav { padding: 16px 0; }
        
        .sidebar-item {
            padding: 12px 20px; cursor: pointer; border-left: 3px solid transparent;
            font-size: 14px; font-weight: 500; color: var(--muted);
            display: flex; align-items: center; gap: 10px;
            margin: 2px 12px; border-radius: 8px; transition: 0.2s;
        }
        
        .sidebar-item:hover { background: rgba(155,77,255,0.1); color: #c9b0ff; }
        .sidebar-item.active { background: rgba(155,77,255,0.15); border-left-color: var(--accent); color: #c9b0ff; }
        
        .sidebar-category {
            padding: 20px 20px 8px; font-size: 10px; font-weight: 700;
            color: #6b5b85; text-transform: uppercase; letter-spacing: 1.5px; margin-top: 8px;
        }
        
        .main-content {
            margin-top: 80px; padding: 28px 32px;
            max-width: 1320px; margin-left: auto; margin-right: auto;
            min-height: calc(100vh - 120px);
        }
        
        .hero-section { text-align: center; margin-bottom: 50px; }
        
        .hero-image {
            width: 160px; height: 160px; border-radius: 50%;
            border: 3px solid var(--accent);
            box-shadow: 0 0 40px rgba(155,77,255,0.3); margin-bottom: 30px;
        }
        
        .hero-title {
            font-size: 48px; font-weight: 900;
            background: linear-gradient(135deg, #d9c5ff, #9b4dff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px;
        }
        
        .hero-subtitle { font-size: 16px; color: var(--muted); margin-bottom: 16px; }
        
        .hero-version {
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(155,77,255,0.15); border: 1px solid var(--border);
            color: #c9b0ff; padding: 8px 20px; border-radius: 50px; font-size: 13px;
        }
        
        .stats-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px; margin: 40px 0;
        }
        
        .stat-card {
            background: var(--card); border-radius: 20px; padding: 28px 24px;
            text-align: center; border: 1px solid var(--border); transition: 0.3s;
        }
        
        .stat-card:hover { transform: translateY(-6px); border-color: var(--accent); }
        .stat-icon { font-size: 28px; margin-bottom: 12px; color: var(--accent); }
        .stat-number { font-size: 40px; font-weight: 800; color: var(--text); margin-bottom: 4px; }
        .stat-label { font-size: 13px; color: var(--muted); text-transform: uppercase; }
        
        .page-header { margin-bottom: 30px; }
        .page-title { font-size: 28px; font-weight: 800; color: var(--text); margin-bottom: 6px; }
        .page-subtitle { font-size: 14px; color: var(--muted); }
        
        .search-input {
            width: 100%; padding: 14px 20px; border: 1px solid var(--border);
            border-radius: 16px; font-size: 15px; background: rgba(20,15,35,0.6);
            color: var(--text); margin-bottom: 24px; outline: none;
        }
        
        .search-input:focus { border-color: var(--accent); }
        
        .endpoints-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 16px; margin-top: 20px;
        }
        
        .endpoint-card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 16px; padding: 20px; transition: 0.3s;
        }
        
        .endpoint-card:hover { border-color: var(--accent); }
        
        .endpoint-header {
            display: flex; justify-content: space-between; align-items: start; margin-bottom: 12px;
        }
        
        .endpoint-method {
            font-size: 10px; font-weight: 700; color: #10b981;
            background: rgba(16,185,129,0.1); padding: 3px 8px;
            border-radius: 6px; display: inline-block; margin-bottom: 8px;
        }
        
        .endpoint-name { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
        .endpoint-path {
            font-size: 12px; color: var(--accent); font-family: monospace;
            background: rgba(0,0,0,0.3); padding: 4px 8px; border-radius: 6px;
            word-break: break-all; margin-bottom: 8px;
        }
        .endpoint-desc { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
        
        .endpoint-actions { display: flex; gap: 8px; }
        
        .btn-probar {
            background: rgba(155,77,255,0.15); border: 1px solid rgba(155,77,255,0.3);
            color: #c9b0ff; padding: 8px 16px; border-radius: 30px;
            font-size: 12px; font-weight: 600; cursor: pointer; transition: 0.2s;
            display: flex; align-items: center; gap: 6px;
        }
        
        .btn-probar:hover {
            background: rgba(155,77,255,0.3); border-color: var(--accent);
            box-shadow: 0 0 15px rgba(155,77,255,0.3);
        }
        
        .btn-copiar {
            background: rgba(155,77,255,0.1); border: 1px solid rgba(155,77,255,0.2);
            color: #988ab3; padding: 8px 12px; border-radius: 30px;
            font-size: 12px; cursor: pointer; transition: 0.2s;
        }
        
        .btn-copiar:hover { background: rgba(155,77,255,0.2); color: #c9b0ff; }
        .btn-copiar.copiado { color: #10b981; border-color: #10b981; }
        
        .features-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px; margin-top: 40px;
        }
        
        .feature-card {
            background: var(--card); border-radius: 16px; padding: 24px;
            border: 1px solid var(--border); transition: 0.3s;
        }
        
        .feature-card:hover { border-color: var(--accent); transform: translateY(-4px); }
        
        .feature-icon {
            width: 44px; height: 44px; background: rgba(155,77,255,0.15);
            border-radius: 12px; display: flex; align-items: center;
            justify-content: center; font-size: 20px; color: var(--accent); margin-bottom: 16px;
        }
        
        .feature-title { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
        .feature-desc { font-size: 13px; color: var(--muted); }
        
        .footer {
            text-align: center; padding: 28px; border-top: 1px solid var(--border);
            margin-top: 60px; font-size: 12px; color: #6b5b85;
        }
        
        .modal-content {
            background: #120e1c; color: var(--text);
            border: 1px solid var(--border); border-radius: 20px;
        }
        
        .modal-header { border-bottom: 1px solid var(--border); }
        .modal-footer { border-top: 1px solid var(--border); }
        .modal-header .btn-close { filter: invert(1); }
        
        .api-endpoint-box {
            background: rgba(0,0,0,0.3); padding: 14px; border-radius: 12px;
            font-family: monospace; font-size: 13px; color: #c9b0ff;
            margin-bottom: 20px; border: 1px solid var(--border); word-break: break-all;
        }
        
        .live-url-box {
            background: rgba(0,0,0,0.3); padding: 14px 16px; border-radius: 12px;
            font-family: monospace; font-size: 13px; color: var(--accent);
            margin-bottom: 20px; border: 1px solid var(--border); word-break: break-all;
        }
        
        .param-input {
            width: 100%; padding: 12px 16px; border: 1px solid var(--border);
            border-radius: 12px; font-size: 14px; margin-bottom: 12px;
            background: rgba(0,0,0,0.3); color: var(--text); outline: none;
        }
        
        .param-input:focus { border-color: var(--accent); }
        
        .response-box {
            background: rgba(0,0,0,0.3); border: 1px solid var(--border);
            color: #c9b0ff; border-radius: 12px; padding: 16px;
            font-family: monospace; font-size: 12px; white-space: pre-wrap;
            max-height: 400px; overflow-y: auto; margin-top: 20px;
        }
        
        .status-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px; margin-top: 30px;
        }
        
        .status-card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 16px; padding: 28px; transition: 0.3s;
        }
        
        .status-card:hover { border-color: var(--accent); transform: translateY(-3px); }
        
        .status-indicator {
            width: 14px; height: 14px; background: #10b981; border-radius: 50%;
            display: inline-block; margin-right: 8px;
            box-shadow: 0 0 12px rgba(16,185,129,0.6);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 12px rgba(16,185,129,0.6); }
            50% { box-shadow: 0 0 24px rgba(16,185,129,1); }
        }
        
        .status-card-title {
            font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
            color: #6b5b85; margin-bottom: 12px; font-weight: 600;
        }
        
        .status-card-value { font-size: 24px; font-weight: 700; color: var(--text); }
        .status-card-icon { font-size: 32px; color: var(--accent); margin-bottom: 12px; }
        
        .music-player {
            position: fixed; bottom: 24px; right: 24px; width: 300px;
            background: var(--card); border-radius: 20px; padding: 16px;
            z-index: 9999; border: 1px solid var(--border);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6); transition: 0.3s;
        }
        
        .music-player.minimized { width: 50px; padding: 10px; border-radius: 50px; }
        .music-player.minimized .music-info,
        .music-player.minimized .music-controls,
        .music-player.minimized .progress-container { display: none; }
        
        .music-header { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .music-title { font-size: 11px; opacity: 0.7; }
        .music-info { text-align: center; margin-bottom: 10px; }
        .song-name { font-size: 14px; font-weight: 600; color: var(--text); }
        .artist-name { color: var(--accent); font-size: 11px; }
        
        .progress-container {
            background: rgba(255,255,255,0.08); border-radius: 10px;
            height: 4px; margin: 10px 0; cursor: pointer;
        }
        
        .progress-bar {
            background: linear-gradient(135deg, #9b4dff, #6a1b9a);
            border-radius: 10px; height: 100%; width: 0%; transition: width 0.1s;
        }
        
        .time-info { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); }
        .music-controls { display: flex; justify-content: center; gap: 14px; margin-top: 6px; }
        
        .control-btn {
            background: rgba(155,77,255,0.15); border: none; border-radius: 50%;
            width: 34px; height: 34px; cursor: pointer; color: var(--text);
            font-size: 13px; display: flex; align-items: center; justify-content: center;
        }
        
        .control-btn.play-btn {
            background: linear-gradient(135deg, #9b4dff, #6a1b9a);
            width: 44px; height: 44px;
        }
        
        @media (max-width: 768px) {
            .hero-title { font-size: 34px; }
            .main-content { padding: 20px 16px; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
            .features-grid { grid-template-columns: 1fr; }
            .endpoints-grid { grid-template-columns: 1fr; }
            .music-player { width: 260px; }
        }
    </style>
</head>
<body>
    <div id="loadingScreen">
        <div class="spinner"></div>
        <p style="margin-top: 16px; color: #988ab3;">Cargando API DE EL VIGILANTE</p>
    </div>

    <div id="authScreen">
        <div class="auth-card">
            <img src="https://files.catbox.moe/0tha19.png" alt="Logo" class="auth-logo">
            <div class="auth-title">API DE EL VIGILANTE</div>
            <div class="auth-subtitle">Plan Pro · Acceso Exclusivo</div>
            <div id="authFormContainer"></div>
        </div>
    </div>

    <div class="music-player" id="musicPlayer">
        <div class="music-header">
            <span class="music-title">🎵 ACENTO · QUINTO REAL</span>
            <button id="toggleMinimize" style="background:none;border:none;color:#e0d7f0;cursor:pointer;">−</button>
        </div>
        <div class="music-info">
            <div class="song-name" id="songName">Una vaina loca</div>
            <div class="artist-name" id="artistName">Acento Quinto Real</div>
        </div>
        <div class="progress-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="time-info">
            <span id="currentTime">0:00</span>
            <span id="duration">0:00</span>
        </div>
        <div class="music-controls">
            <button class="control-btn" id="prevBtn"><i class="fas fa-backward"></i></button>
            <button class="control-btn play-btn" id="playPauseBtn"><i class="fas fa-play"></i></button>
            <button class="control-btn" id="nextBtn"><i class="fas fa-forward"></i></button>
        </div>
    </div>
    <audio id="audioPlayer"></audio>

    <div class="top-bar" id="topBar" style="display: none;">
        <div class="top-bar-left">
            <button class="menu-toggle" id="menuToggle"><span></span><span></span><span></span></button>
            <div class="api-name" id="apiName">EL VIGILANTE</div>
            <span class="pro-badge">PRO</span>
        </div>
        <div class="user-section" id="userSection"></div>
    </div>

    <div class="sidebar-overlay" id="sidebarOverlay" style="display: none;"></div>
    <div class="sidebar" id="sidebar" style="display: none;">
        <div class="sidebar-nav">
            <div class="sidebar-item active" data-page="home"><i class="fas fa-home"></i> Dashboard</div>
            <div class="sidebar-item" data-page="status"><i class="fas fa-chart-line"></i> Estado</div>
            <div class="sidebar-category">Categorías</div>
            <div id="categoriesNav"></div>
            <div class="sidebar-item" data-page="all"><i class="fas fa-cubes"></i> Todos los endpoints</div>
        </div>
    </div>

    <div class="main-content" id="mainContent" style="display: none;"></div>

    <div class="footer" id="footer" style="display: none;">
        <p id="footerText">🛡️ API DE EL VIGILANTE · Plan Pro · Música: Acento Quinto Real</p>
    </div>

    <div class="modal fade" id="apiModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <div>
                        <h5 class="modal-title" id="modalTitle"></h5>
                        <p id="modalDesc" style="font-size:13px;color:#988ab3;"></p>
                    </div>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="api-endpoint-box" id="endpointBox" style="display: none;"></div>
                    <div class="live-url-box" id="liveUrlBox" style="display: none;">
                        <i class="fas fa-link me-2"></i> <span id="liveUrlText"></span>
                    </div>
                    <div id="paramsContainer"></div>
                    <div id="loadingContainer" style="display: none; text-align: center; padding: 40px;">
                        <div class="spinner"></div>
                    </div>
                    <div id="responseContainer"></div>
                </div>
                <div class="modal-footer">
                    <button class="btn-primary" id="submitBtn" style="display: none; width: auto;">
                        <i class="fas fa-paper-plane me-2"></i> Enviar petición
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ========== REPRODUCTOR ==========
        const playlist = [
            { name: "Acento Quinto Real", artist: "Acento Quinto Real", url: "https://files.catbox.moe/65kqmi.mp3" },
            { name: "Una vaina loca", artist: "Acento Quinto Real", url: "https://files.catbox.moe/g2zd2z.mp3" }
        ];
        let currentSong = 0, playing = false, minimized = false;
        const audio = document.getElementById('audioPlayer');
        
        function loadSong(i) {
            const s = playlist[i];
            document.getElementById('songName').textContent = s.name;
            document.getElementById('artistName').textContent = s.artist;
            audio.src = s.url;
            audio.load();
            if(playing) audio.play().catch(()=>{});
            updatePlayIcon();
        }
        
        function updatePlayIcon() {
            document.getElementById('playPauseBtn').querySelector('i').className = playing ? 'fas fa-pause' : 'fas fa-play';
        }
        
        function togglePlay() {
            playing ? audio.pause() : audio.play().catch(()=>{});
            playing = !playing;
            updatePlayIcon();
        }
        
        function next() { currentSong = (currentSong+1)%playlist.length; loadSong(currentSong); if(!playing) togglePlay(); }
        function prev() { currentSong = (currentSong-1+playlist.length)%playlist.length; loadSong(currentSong); if(!playing) togglePlay(); }
        
        audio.ontimeupdate = () => {
            if(audio.duration) {
                document.getElementById('progressBar').style.width = (audio.currentTime/audio.duration)*100+'%';
                document.getElementById('currentTime').textContent = formatTime(audio.currentTime);
                document.getElementById('duration').textContent = formatTime(audio.duration);
            }
        };
        
        audio.onended = next;
        
        function formatTime(s) {
            if(isNaN(s)) return "0:00";
            return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
        }
        
        document.getElementById('progressContainer').onclick = e => {
            audio.currentTime = ((e.clientX - e.target.getBoundingClientRect().left) / e.target.offsetWidth) * audio.duration;
        };
        
        document.getElementById('playPauseBtn').onclick = togglePlay;
        document.getElementById('nextBtn').onclick = next;
        document.getElementById('prevBtn').onclick = prev;
        document.getElementById('toggleMinimize').onclick = () => {
            minimized = !minimized;
            document.getElementById('musicPlayer').classList.toggle('minimized');
            document.getElementById('toggleMinimize').textContent = minimized ? '+' : '−';
        };
        
        loadSong(0);

        // ========== AUTENTICACIÓN ==========
        const CODE = "elvigilante";
        const getUsers = () => JSON.parse(localStorage.getItem('vu')||'[]');
        const saveUsers = u => localStorage.setItem('vu', JSON.stringify(u));
        const getUser = () => JSON.parse(localStorage.getItem('vcu')||'null');
        const setUser = u => localStorage.setItem('vcu', JSON.stringify(u));

        function showApp() {
            document.getElementById('authScreen').style.display = 'none';
            ['topBar','sidebar','mainContent','footer','sidebarOverlay'].forEach(id => {
                document.getElementById(id).style.display = '';
            });
            updateUserUI();
            renderPage('home');
        }

        function showAuth(v='login') {
            document.getElementById('authScreen').style.display = 'flex';
            ['topBar','sidebar','mainContent','footer','sidebarOverlay'].forEach(id => {
                document.getElementById(id).style.display = 'none';
            });
            document.getElementById('authFormContainer').innerHTML = v === 'login' ? `
                <input type="text" id="lu" placeholder="Usuario">
                <input type="password" id="lp" placeholder="Contraseña">
                <button class="btn-primary" onclick="login()">Iniciar sesión</button>
                <div class="auth-divider">¿No tienes cuenta?</div>
                <a class="auth-link" onclick="showAuth('register')">Crear una cuenta</a>
            ` : `
                <input type="text" id="ru" placeholder="Usuario">
                <input type="password" id="rp" placeholder="Contraseña">
                <input type="text" id="rc" placeholder="Código de invitación">
                <button class="btn-primary" onclick="register()">Crear cuenta</button>
                <div class="auth-divider">¿Ya tienes cuenta?</div>
                <a class="auth-link" onclick="showAuth('login')">Iniciar sesión</a>
            `;
        }

        function login() {
            const u = document.getElementById('lu')?.value.trim();
            const p = document.getElementById('lp')?.value.trim();
            if(!u||!p) return alert('Completa todos los campos');
            const user = getUsers().find(x => x.username === u && x.password === p);
            if(user) { setUser({username: user.username}); showApp(); }
            else alert('Credenciales incorrectas');
        }

        function register() {
            const u = document.getElementById('ru')?.value.trim();
            const p = document.getElementById('rp')?.value.trim();
            const c = document.getElementById('rc')?.value.trim();
            if(!u||!p||!c) return alert('Completa todos los campos');
            if(c !== CODE) return alert('Código de invitación inválido');
            const users = getUsers();
            if(users.find(x => x.username === u)) return alert('El usuario ya existe');
            users.push({username: u, password: p});
            saveUsers(users);
            setUser({username: u});
            showApp();
            alert('¡Cuenta creada! Bienvenido al Plan Pro');
        }

        function logout() { localStorage.removeItem('vcu'); showAuth('login'); }

        function updateUserUI() {
            const user = getUser();
            if(user) {
                document.getElementById('userSection').innerHTML = `
                    <span style="color:#c9b0ff;font-size:13px;"><i class="fas fa-user-circle me-1"></i> ${user.username}</span>
                    <button class="btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Salir</button>
                `;
            }
        }

        // ========== SETTINGS ==========
        let settings = {
            name: "EL VIGILANTE",
            version: "v2.0 · Plan Pro",
            description: "API profesional con endpoints exclusivos.",
            header: { imageSrc: ["https://files.catbox.moe/0tha19.png"] },
            categories: []
        };

        async function loadSettings() {
            try {
                const r = await fetch('/src/settings.json');
                if(r.ok) {
                    settings = await r.json();
                    console.log('✅ Settings cargados:', settings);
                }
            } catch(e) {
                console.log('⚠️ Usando defaults');
                settings.categories = [
                    { name: "Usuarios", items: [{ name: "Perfil", path: "/api/user", desc: "Obtener perfil de usuario", innerDesc: "Datos del perfil" }] },
                    { name: "Contenido", items: [{ name: "Feed", path: "/api/feed", desc: "Feed dinámico", innerDesc: "Últimas publicaciones" }] },
                    { name: "Búsqueda", items: [{ name: "YouTube Search", path: "/search/youtube?q=", desc: "Buscar en YouTube", innerDesc: "Ejemplo: Goku Black" }] },
                    { name: "Música", items: [{ name: "Canción actual", path: "/api/song", desc: "Info de canción", innerDesc: "Canción actual" }] }
                ];
            }
            
            document.getElementById('apiName').textContent = settings.name;
            document.getElementById('footerText').innerHTML = `🛡️ ${settings.name} · Plan Pro · Música: Acento Quinto Real`;
            
            const nav = document.getElementById('categoriesNav');
            nav.innerHTML = '';
            settings.categories?.forEach(cat => {
                const d = document.createElement('div');
                d.className = 'sidebar-item';
                d.dataset.page = 'category';
                d.dataset.category = cat.name;
                d.innerHTML = `<i class="fas fa-folder"></i> ${cat.name}`;
                nav.appendChild(d);
            });
        }

        function getTotal() {
            return settings.categories?.reduce((t, c) => t + (c.items?.length || 0), 0) || 0;
        }

        // ========== UI ==========
        function initUI() {
            const toggle = document.getElementById('menuToggle');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            
            toggle.onclick = () => {
                toggle.classList.toggle('active');
                sidebar.classList.toggle('active');
                overlay.classList.toggle('active');
            };
            
            overlay.onclick = () => {
                toggle.classList.remove('active');
                sidebar.classList.remove('active');
                overlay.classList.remove('active');
            };
            
            refreshSidebarEvents();
        }

        function refreshSidebarEvents() {
            document.querySelectorAll('.sidebar-item').forEach(item => {
                item.onclick = function() {
                    document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active'));
                    this.classList.add('active');
                    const page = this.dataset.page;
                    const cat = this.dataset.category;
                    renderPage(page === 'category' ? 'category' : page, cat);
                    document.getElementById('menuToggle').classList.remove('active');
                    document.getElementById('sidebar').classList.remove('active');
                    document.getElementById('sidebarOverlay').classList.remove('active');
                };
            });
        }

        function renderPage(page, cat = null) {
            const c = document.getElementById('mainContent');
            
            if(page === 'home') {
                c.innerHTML = `
                    <div class="hero-section">
                        <img src="${settings.header?.imageSrc?.[0] || 'https://files.catbox.moe/0tha19.png'}" class="hero-image">
                        <h1 class="hero-title">API DE EL VIGILANTE</h1>
                        <p class="hero-subtitle">${settings.description}</p>
                        <div class="hero-version"><i class="fas fa-crown" style="color:#fbbf24;"></i> ${settings.version}</div>
                    </div>
                    <div class="stats-grid">
                        <div class="stat-card"><div class="stat-icon"><i class="fas fa-code"></i></div><div class="stat-number">${getTotal()}</div><div class="stat-label">Endpoints</div></div>
                        <div class="stat-card"><div class="stat-icon"><i class="fas fa-layer-group"></i></div><div class="stat-number">${settings.categories?.length||0}</div><div class="stat-label">Categorías</div></div>
                        <div class="stat-card"><div class="stat-icon"><i class="fas fa-music"></i></div><div class="stat-number">24/7</div><div class="stat-label">Música Activa</div></div>
                        <div class="stat-card"><div class="stat-icon"><i class="fas fa-shield-haltered"></i></div><div class="stat-number">PRO</div><div class="stat-label">Plan Actual</div></div>
                    </div>
                    <div class="features-grid">
                        <div class="feature-card"><div class="feature-icon"><i class="fas fa-bolt"></i></div><div class="feature-title">Rendimiento Óptimo</div><div class="feature-desc">API de alta velocidad con respuestas rápidas.</div></div>
                        <div class="feature-card"><div class="feature-icon"><i class="fas fa-lock"></i></div><div class="feature-title">Acceso Exclusivo</div><div class="feature-desc">Solo con código de invitación.</div></div>
                        <div class="feature-card"><div class="feature-icon"><i class="fas fa-headphones"></i></div><div class="feature-title">Música Integrada</div><div class="feature-desc">Acento Quinto Real sonando.</div></div>
                        <div class="feature-card"><div class="feature-icon"><i class="fas fa-chart-bar"></i></div><div class="feature-title">Estadísticas</div><div class="feature-desc">Monitoreo en tiempo real.</div></div>
                    </div>
                `;
            } else if(page === 'status') {
                c.innerHTML = `
                    <div class="page-header"><div class="page-title">Estado del Sistema</div><div class="page-subtitle">Monitoreo en tiempo real</div></div>
                    <div class="status-grid">
                        <div class="status-card"><div class="status-card-icon"><i class="fas fa-server"></i></div><div class="status-card-title">API Status</div><div class="status-card-value"><span class="status-indicator"></span> Online</div></div>
                        <div class="status-card"><div class="status-card-icon"><i class="fas fa-code-branch"></i></div><div class="status-card-title">Versión</div><div class="status-card-value">${settings.version}</div></div>
                        <div class="status-card"><div class="status-card-icon"><i class="fas fa-cubes"></i></div><div class="status-card-title">Endpoints Totales</div><div class="status-card-value">${getTotal()}</div></div>
                        <div class="status-card"><div class="status-card-icon"><i class="fas fa-folder-tree"></i></div><div class="status-card-title">Categorías</div><div class="status-card-value">${settings.categories?.length||0}</div></div>
                        <div class="status-card"><div class="status-card-icon"><i class="fas fa-music"></i></div><div class="status-card-title">Música Activa</div><div class="status-card-value" style="color:#9b4dff;">🎵 Una vaina loca</div></div>
                        <div class="status-card"><div class="status-card-icon"><i class="fas fa-user-shield"></i></div><div class="status-card-title">Artista</div><div class="status-card-value">Acento Quinto Real</div></div>
                    </div>
                `;
            } else if(page === 'category' && cat) {
                const category = settings.categories.find(x => x.name === cat);
                if(!category) return;
                c.innerHTML = `
                    <div class="page-header"><div class="page-title"><i class="fas fa-folder-open me-2" style="color:#9b4dff;"></i> ${category.name}</div><div class="page-subtitle">${category.items.length} endpoints</div></div>
                    <input type="text" class="search-input" placeholder="🔍 Buscar..." id="searchInput">
                    <div class="endpoints-grid">${category.items.map(item => `
                        <div class="endpoint-card" data-name="${item.name.toLowerCase()}">
                            <div class="endpoint-header"><span class="endpoint-method">GET</span></div>
                            <div class="endpoint-name">${item.name}</div>
                            <div class="endpoint-path">${item.path}</div>
                            <div class="endpoint-desc">${item.desc}</div>
                            <div class="endpoint-actions">
                                <button class="btn-probar" data-path="${item.path}" data-name="${item.name}" data-desc="${item.desc}" data-inner="${item.innerDesc||''}"><i class="fas fa-play"></i> Probar</button>
                                <button class="btn-copiar" data-path="${item.path}" title="Copiar endpoint"><i class="fas fa-copy"></i></button>
                            </div>
                        </div>
                    `).join('')}</div>
                `;
                setupSearch();
                setupButtons();
            } else if(page === 'all') {
                c.innerHTML = `
                    <div class="page-header"><div class="page-title">Todos los Endpoints</div><div class="page-subtitle">${getTotal()} endpoints en ${settings.categories?.length||0} categorías</div></div>
                    <input type="text" class="search-input" placeholder="🔍 Buscar..." id="searchInput">
                    ${settings.categories.map(cat => `
                        <h3 style="color:#c9b0ff;font-size:18px;margin:24px 0 16px;"><i class="fas fa-folder me-2" style="color:#9b4dff;"></i> ${cat.name}</h3>
                        <div class="endpoints-grid">${cat.items.map(item => `
                            <div class="endpoint-card" data-name="${item.name.toLowerCase()}">
                                <div class="endpoint-header"><span class="endpoint-method">GET</span></div>
                                <div class="endpoint-name">${item.name}</div>
                                <div class="endpoint-path">${item.path}</div>
                                <div class="endpoint-desc">${item.desc}</div>
                                <div class="endpoint-actions">
                                    <button class="btn-probar" data-path="${item.path}" data-name="${item.name}" data-desc="${item.desc}" data-inner="${item.innerDesc||''}"><i class="fas fa-play"></i> Probar</button>
                                    <button class="btn-copiar" data-path="${item.path}" title="Copiar endpoint"><i class="fas fa-copy"></i></button>
                                </div>
                            </div>
                        `).join('')}</div>
                    `).join('')}
                `;
                setupSearch();
                setupButtons();
            }
        }

        function setupSearch() {
            const inp = document.getElementById('searchInput');
            if(!inp) return;
            inp.oninput = e => {
                const t = e.target.value.toLowerCase();
                document.querySelectorAll('.endpoint-card').forEach(card => {
                    card.style.display = card.dataset.name.includes(t) ? '' : 'none';
                });
            };
        }

        function setupButtons() {
            // Botones PROBAR
            document.querySelectorAll('.btn-probar').forEach(btn => {
                btn.onclick = function() {
                    const modal = new bootstrap.Modal(document.getElementById('apiModal'));
                    const path = this.dataset.path;
                    const name = this.dataset.name;
                    const desc = this.dataset.desc;
                    const inner = this.dataset.inner;
                    
                    document.getElementById('modalTitle').textContent = name;
                    document.getElementById('modalDesc').textContent = desc;
                    
                    const parts = path.split('?');
                    const base = parts[0];
                    const params = new URLSearchParams(parts[1] || '');
                    const url = window.location.origin + base;
                    
                    document.getElementById('endpointBox').style.display = 'block';
                    document.getElementById('endpointBox').innerHTML = `<code>${url}</code>`;
                    document.getElementById('liveUrlBox').style.display = 'flex';
                    document.getElementById('liveUrlText').textContent = url;
                    document.getElementById('paramsContainer').innerHTML = '';
                    document.getElementById('responseContainer').innerHTML = '';
                    document.getElementById('submitBtn').style.display = 'none';
                    document.getElementById('loadingContainer').style.display = 'none';
                    
                    if([...params.keys()].length > 0) {
                        for(let [k, v] of params) {
                            const inp = document.createElement('input');
                            inp.type = 'text';
                            inp.className = 'param-input';
                            inp.placeholder = `${k} (ej: ${v || 'valor'})`;
                            inp.dataset.param = k;
                            document.getElementById('paramsContainer').appendChild(inp);
                        }
                        if(inner) {
                            document.getElementById('paramsContainer').innerHTML += `
                                <div style="color:#988ab3;font-size:12px;margin-bottom:12px;">
                                    <i class="fas fa-info-circle me-1" style="color:#9b4dff;"></i> ${inner}
                                </div>`;
                        }
                        document.getElementById('submitBtn').style.display = 'inline-flex';
                        document.getElementById('submitBtn').onclick = async () => {
                            const p = new URLSearchParams();
                            document.querySelectorAll('#paramsContainer .param-input').forEach(inp => {
                                if(inp.value.trim()) p.append(inp.dataset.param, inp.value.trim());
                            });
                            let finalUrl = url;
                            if(p.toString()) finalUrl += '?' + p.toString();
                            document.getElementById('loadingContainer').style.display = 'block';
                            document.getElementById('responseContainer').innerHTML = '';
                            try {
                                const r = await fetch(finalUrl);
                                const d = await r.json();
                                document.getElementById('responseContainer').innerHTML = `<pre class="response-box">${JSON.stringify(d,null,2)}</pre>`;
                            } catch(e) {
                                document.getElementById('responseContainer').innerHTML = `<pre class="response-box" style="color:#ef4444;">Error: ${e.message}</pre>`;
                            }
                            document.getElementById('loadingContainer').style.display = 'none';
                        };
                    } else {
                        document.getElementById('loadingContainer').style.display = 'block';
                        fetch(url).then(async r => {
                            const d = await r.json();
                            document.getElementById('responseContainer').innerHTML = `<pre class="response-box">${JSON.stringify(d,null,2)}</pre>`;
                        }).catch(e => {
                            document.getElementById('responseContainer').innerHTML = `<pre class="response-box" style="color:#ef4444;">Error: ${e.message}</pre>`;
                        }).finally(() => {
                            document.getElementById('loadingContainer').style.display = 'none';
                        });
                    }
                    
                    modal.show();
                };
            });
            
            // Botones COPIAR
            document.querySelectorAll('.btn-copiar').forEach(btn => {
                btn.onclick = function() {
                    const path = this.dataset.path;
                    const url = window.location.origin + path;
                    navigator.clipboard.writeText(url).then(() => {
                        this.classList.add('copiado');
                        this.innerHTML = '<i class="fas fa-check"></i> Copiado';
                        setTimeout(() => {
                            this.classList.remove('copiado');
                            this.innerHTML = '<i class="fas fa-copy"></i>';
                        }, 2000);
                    });
                };
            });
        }

        async function start() {
            await loadSettings();
            initUI();
            if(getUser()) showApp();
            else showAuth('login');
            setTimeout(() => {
                document.getElementById('loadingScreen').style.opacity = '0';
                setTimeout(() => document.getElementById('loadingScreen').style.display = 'none', 500);
            }, 300);
        }

        start();
    </script>
</body>
</html>
